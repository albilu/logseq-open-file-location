name: Publish plugin

on:
  push:
    tags:
      - 'v*'

env:
  PLUGIN_NAME: logseq-open-file-location

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts

      - name: Validate runtime and bundled SDK
        run: npm run check

      - name: Prepare package directory
        run: npm run package

      - name: Create release archives
        run: |
          cd dist
          zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"
          tar -czf "$PLUGIN_NAME.tar.gz" "$PLUGIN_NAME"

      - name: Create GitHub release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "dist/${{ env.PLUGIN_NAME }}.zip,dist/${{ env.PLUGIN_NAME }}.tar.gz"
          draft: false
          prerelease: false
          generateReleaseNotes: true
